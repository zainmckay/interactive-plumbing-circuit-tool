<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Rig — Appliance Branch Visual</title>
<style>
  :root{
    --paper:#f6f4ec; --ink:#26251f; --faint:#8d8a7e;
    --hot:#b23a2a; --cool:#2b5d8c; --makeup:#3f7d4e;
    --chipbg:#eceadf; --chipon:#26251f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:ui-monospace,'IBM Plex Mono','Cascadia Mono',Menlo,Consolas,monospace;}
  header{padding:14px 20px 6px}
  header h1{font-size:15px;margin:0;letter-spacing:.06em;font-weight:600}
  header p{margin:4px 0 0;font-size:11px;color:var(--faint);letter-spacing:.03em}
  #chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 20px 4px}
  .chip{border:1px solid var(--ink);background:var(--chipbg);color:var(--ink);
    font:inherit;font-size:11px;letter-spacing:.04em;padding:5px 10px;cursor:pointer;
    border-radius:2px;display:flex;gap:7px;align-items:center}
  .chip .dot{width:8px;height:8px;border:1px solid var(--ink);display:inline-block;background:transparent}
  .chip.on{background:var(--chipon);color:var(--paper)}
  .chip.on .dot{background:var(--paper);border-color:var(--paper)}
  .chip:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  #modes{display:flex;padding:10px 20px 0}
  .mseg{border:1px solid var(--ink);background:var(--chipbg);color:var(--ink);font:inherit;
    font-size:11px;letter-spacing:.05em;padding:5px 14px;cursor:pointer}
  .mseg.on{background:var(--ink);color:var(--paper)}
  .mseg:first-child{border-radius:2px 0 0 2px}
  .mseg:last-child{border-radius:0 2px 2px 0;border-left:none}
  #bank{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 20px 0}
  #bank[hidden]{display:none}
  .bankitem{border:1px dashed var(--ink);background:var(--paper);display:flex;flex-direction:column;
    align-items:center;gap:1px;padding:4px 6px;font:inherit;font-size:8px;color:#5c594e;
    cursor:grab;touch-action:none;border-radius:2px;min-width:56px}
  .bankitem:active{cursor:grabbing}
  #bankhint{font-size:10px;color:var(--faint);letter-spacing:.03em;flex-basis:100%}
  svg.custom [data-cid]{cursor:grab;touch-action:none}
  #ghost{position:fixed;pointer-events:none;z-index:20;opacity:.85}
  #stage{padding:4px 12px 16px}
  svg{width:100%;height:auto;display:block;background:var(--paper)}
  .cab{fill:#e3e0d4;stroke:var(--ink);stroke-width:1.4}
  .cab.dark{fill:#b8b5aa}
  .cabtxt{font-size:9.5px;fill:var(--ink)}
  .cabsub{font-size:8px;fill:#5c594e}
  .pipe{fill:none;stroke-width:3;stroke-linecap:square;stroke-linejoin:miter}
  .pipe.hot{stroke:var(--hot)} .pipe.cool{stroke:var(--cool)}
  .pipe.thin{stroke-width:2.2}
  .pipe.makeup{stroke:var(--makeup);stroke-width:1.8;stroke-dasharray:6 4}
  .pipe.supply{stroke:var(--makeup);stroke-width:2.4}
  svg.openloop .tankiso .sym{fill:var(--ink)}
  svg.openloop .tankshell .cab{opacity:.5}
  svg.openloop .tankshell .cabtxt, svg.openloop .tankshell .cabsub{opacity:.5}
  .sym{stroke:var(--ink);stroke-width:1.2;fill:var(--paper)}
  .symfill{fill:var(--ink)}
  .lbl{font-size:8.5px;fill:#5c594e}
  .dim{stroke:var(--faint);stroke-width:.8}
  .dimtxt{font-size:8.5px;fill:var(--faint)}
  [data-name]{cursor:crosshair}
  [data-name]:hover .sym{stroke-width:2}
  g.station.hidden{display:none}
  .floorline{stroke:var(--ink);stroke-width:2}
  #tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);
    font-size:11px;padding:4px 8px;border-radius:2px;opacity:0;transition:opacity .08s;
    letter-spacing:.03em;z-index:10;max-width:260px}
  .tblock{font-size:8px;fill:var(--faint)}
  @media (prefers-reduced-motion: reduce){#tip{transition:none}}
</style>
</head>
<body>
<header>
  <h1>HVAC / HYDRONIC TRAINING RIG — APPLIANCE BRANCH VISUAL</h1>
  <p>WALL ELEVATION BASIS: CREO 239" O/A · SELECT APPLIANCES TO SHOW EACH BRANCH PIPED TO TK-1 · HOVER ANY COMPONENT OR PIPE FOR ITS NAME / SIZE</p>
</header>
<div id="modes" role="group" aria-label="Layout mode">
  <button id="m-default" class="mseg on" aria-pressed="true">CES DEFAULT</button>
  <button id="m-custom" class="mseg" aria-pressed="false">CUSTOM</button>
</div>
<div id="chips" role="group" aria-label="Show or hide appliances"></div>
<div id="bank" hidden aria-label="Component bank"></div>
<div id="stage"></div>
<div id="tip" role="status"></div>

<script>
/* ---------- scale: wall inches -> px ---------- */
const S = 4.35, X0 = 46, FLOOR = 486;
const fx = i => X0 + i*S;
const fy = h => FLOOR - h*S;
const VBW = 1170, VBH = 540;

const HM_Y = 96, HM_L = 160, HM_DROP = 222;   // hot manifold: elevation, left cap, tank drop x (in)
const CM_X = 191.5, CM_TOP = 30, RUN_Y = 2.5; // cool manifold x, top, suction-run elevation (in)
const MAN_HOT  = '2" copper — HOT manifold (at tank)';
const MAN_COOL = '2" copper — COOL manifold (at tank)';
/* home-run lanes: hot high & descending L-to-R, cool low & ascending L-to-R = zero crossings */
const LANES = {
 npe:     {hot:{x:29.5, port:36, h:92, tie:164, zone:[42,88]}, cool:{x:15,   port:36, h:9,    zone:[12,34]}},
 loch:    {hot:{x:55.5, port:36, h:89, tie:172, zone:[68,87]}, cool:{x:61.5, port:36, h:12.2, zone:[14.3,34]}},
 laars:   {hot:{x:102.5,port:32, h:86, tie:180, zone:[38,84]}, cool:{x:77.5, port:32, h:15.4, zone:[17.5,30]}},
 altacCH: {hot:{x:109,  port:36, h:83, tie:188, zone:[68,81]}, cool:{x:112,  port:36, h:18.6, zone:[21,34]}},
 altacDHW:{hot:{x:127.5,port:36, h:80, tie:196, zone:[42,78]}, cool:{x:121,  port:36, h:21.8, zone:[24.2,34]}},
 rin:     {hot:{x:148,  port:28, h:77, tie:204, zone:[64,75]}, cool:{x:138,  port:31, h:25}},
 nti:     {hot:{x:178,  port:30, h:74, tie:212, zone:[46,72]}, cool:{x:166.5,port:30, h:28.2}}
};
const BR = '1-1/4" copper — branch';
const ADAPT = 'Adapt to appliance outlet';

/* ---------- symbol builders (return svg strings) ---------- */
const esc = t => String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let COMP_SEQ = 0, PIPES = [], CUR_GROUP = 'tank';
function gwrap(name, inner){ return `<g data-cid="${COMP_SEQ++}" data-name="${esc(name)}">${inner}</g>`; }
function rawg(name, inner){ return `<g data-name="${esc(name)}">${inner}</g>`; }

function symISO(x,y,name){
  const s=5.5;
  return gwrap(name,
   `<path class="sym" d="M ${x-s} ${y-s} L ${x} ${y} L ${x-s} ${y+s} Z M ${x+s} ${y-s} L ${x} ${y} L ${x+s} ${y+s} Z"/>`);
}
function symSVC(x,y,name){ // isolation/flush service valve — bowtie + capped purge stub
  const s=5.5;
  return gwrap(name,
   `<path class="sym" d="M ${x-s} ${y-s} L ${x} ${y} L ${x-s} ${y+s} Z M ${x+s} ${y-s} L ${x} ${y} L ${x+s} ${y+s} Z"/>
    <line class="sym" x1="${x}" y1="${y}" x2="${x+10}" y2="${y}"/>
    <line class="sym" x1="${x+10}" y1="${y-3}" x2="${x+10}" y2="${y+3}"/>`);
}
function symCHK(x,y,name){
  const s=5.5;
  return gwrap(name,
   `<path class="sym" d="M ${x-s} ${y-s} L ${x} ${y} L ${x-s} ${y+s} Z M ${x+s} ${y-s} L ${x} ${y} L ${x+s} ${y+s} Z"/>
    <line class="sym" x1="${x-s}" y1="${y+s}" x2="${x+s}" y2="${y-s}"/>`);
}
function symUNION(x,y,name){
  return gwrap(name,
   `<line class="sym" x1="${x-6}" y1="${y-2.5}" x2="${x+6}" y2="${y-2.5}"/>
    <line class="sym" x1="${x-6}" y1="${y+2.5}" x2="${x+6}" y2="${y+2.5}"/>`);
}
function symPUMP(x,y,name,rot){
  return gwrap(name,
   `<g${rot?` transform="rotate(${rot} ${x} ${y})"`:''}>
    <circle class="sym" cx="${x}" cy="${y}" r="7.5"/>
    <path class="symfill" d="M ${x-3} ${y-4.5} L ${x+4.5} ${y} L ${x-3} ${y+4.5} Z"/>
    <line class="sym" x1="${x-9.5}" y1="${y-4}" x2="${x-9.5}" y2="${y+4}" stroke-width="1.8"/>
    <line class="sym" x1="${x-11.5}" y1="${y-4}" x2="${x-11.5}" y2="${y+4}" stroke-width="1.8"/>
    <line class="sym" x1="${x+9.5}" y1="${y-4}" x2="${x+9.5}" y2="${y+4}" stroke-width="1.8"/>
    <line class="sym" x1="${x+11.5}" y1="${y-4}" x2="${x+11.5}" y2="${y+4}" stroke-width="1.8"/>
   </g>`);
}
function symPRV(x,y,name){ // side relief w/ drip
  return gwrap(name,
   `<line class="sym" x1="${x}" y1="${y}" x2="${x+7}" y2="${y}"/>
    <path class="sym" d="M ${x+7} ${y-4} L ${x+12} ${y} L ${x+7} ${y+4} Z"/>
    <path class="sym" d="M ${x+9.5} ${y-4} l 0 -3 m -2 0 l 4 0"/>
    <line class="sym" x1="${x+13.5}" y1="${y+1}" x2="${x+13.5}" y2="${y+7}" stroke-dasharray="2 2"/>`);
}
function symLWCO(x,y,name){
  return gwrap(name,
   `<rect class="sym" x="${x-8}" y="${y-5}" width="16" height="10"/>
    <text class="lbl" x="${x}" y="${y+2.8}" text-anchor="middle" style="font-size:6.5px">LW</text>`);
}
function symAAV(x,y,name){
  return gwrap(name,
   `<circle class="sym" cx="${x}" cy="${y}" r="5.5"/>
    <text class="lbl" x="${x}" y="${y+2.6}" text-anchor="middle" style="font-size:6.5px">A</text>`);
}
function symDRAIN(x,y,name){
  return gwrap(name,
   `<line class="sym" x1="${x}" y1="${y}" x2="${x+8}" y2="${y}"/>
    <path class="sym" d="M ${x+8} ${y-3.5} L ${x+12} ${y} L ${x+8} ${y+3.5} Z"/>`);
}
function symYSTR(x,y,name){
  return gwrap(name,
   `<path class="sym" d="M ${x-7} ${y-4} h14 l-5 4 v6 h-4 v-6 Z"/>`);
}
function symAS(x,y,name){
  return gwrap(name,
   `<circle class="sym" cx="${x}" cy="${y}" r="8"/>
    <line class="sym" x1="${x}" y1="${y-8}" x2="${x}" y2="${y-13}"/>
    <circle class="sym" cx="${x}" cy="${y-16}" r="3.4"/>`);
}
function symXT(x,y,name){
  return gwrap(name,
   `<rect class="sym" x="${x-9}" y="${y}" width="18" height="24" rx="8"/>
    <line class="sym" x1="${x-9}" y1="${y+13}" x2="${x+9}" y2="${y+13}" stroke-dasharray="2 2"/>
    <text class="lbl" x="${x}" y="${y+9}" text-anchor="middle" style="font-size:6.5px">XT</text>`);
}
function symBFP(x,y,name){
  return gwrap(name,
   `<rect class="sym" x="${x-8}" y="${y-5}" width="16" height="10"/>
    <path class="symfill" d="M ${x-5} ${y-3} L ${x-1} ${y} L ${x-5} ${y+3} Z"/>
    <path class="symfill" d="M ${x+1} ${y-3} L ${x+5} ${y} L ${x+1} ${y+3} Z"/>`);
}
function symPRFV(x,y,name){
  return gwrap(name,
   `<rect class="sym" x="${x-6}" y="${y-5}" width="12" height="10"/>
    <line class="sym" x1="${x}" y1="${y-5}" x2="${x}" y2="${y-10}"/>
    <line class="sym" x1="${x-4}" y1="${y-10}" x2="${x+4}" y2="${y-10}"/>`);
}
function symTI(x,y,name){
  return gwrap(name,
   `<circle class="sym" cx="${x}" cy="${y}" r="5"/>
    <text class="lbl" x="${x}" y="${y+2.6}" text-anchor="middle" style="font-size:6.5px">T</text>`);
}
function symBAL(x,y,name){
  return gwrap(name,
   `<path class="sym" d="M ${x-6} ${y} L ${x} ${y-5} L ${x+6} ${y} L ${x} ${y+5} Z"/>
    <line class="sym" x1="${x}" y1="${y-5}" x2="${x}" y2="${y-8}"/>
    <circle class="sym" cx="${x}" cy="${y-10.5}" r="2.8"/>`);
}
const ALLSYM = {ISO:symISO,SVC:symSVC,CHK:symCHK,UNION:symUNION,PUMP:symPUMP,PRV:symPRV,
  LWCO:symLWCO,AAV:symAAV,DRAIN:symDRAIN,TI:symTI,YSTR:symYSTR,AS:symAS,XT:symXT,BFP:symBFP,PRFV:symPRFV,BAL:symBAL};
Object.keys(ALLSYM).forEach(k=>{
  const orig = ALLSYM[k];
  ALLSYM[k] = (x,y,name,...a)=> orig(x,y,name,...a).replace('<g ', `<g data-ctype="${k}" `);
});
symISO=ALLSYM.ISO; symSVC=ALLSYM.SVC; symCHK=ALLSYM.CHK; symUNION=ALLSYM.UNION;
symPUMP=ALLSYM.PUMP; symPRV=ALLSYM.PRV; symLWCO=ALLSYM.LWCO; symAAV=ALLSYM.AAV;
symDRAIN=ALLSYM.DRAIN; symTI=ALLSYM.TI; symYSTR=ALLSYM.YSTR; symAS=ALLSYM.AS;
symXT=ALLSYM.XT; symBFP=ALLSYM.BFP; symPRFV=ALLSYM.PRFV; symBAL=ALLSYM.BAL;
const SYM = {ISO:ALLSYM.ISO,SVC:ALLSYM.SVC,CHK:ALLSYM.CHK,UNION:ALLSYM.UNION,PUMP:ALLSYM.PUMP,
             PRV:ALLSYM.PRV,LWCO:ALLSYM.LWCO,AAV:ALLSYM.AAV,DRAIN:ALLSYM.DRAIN,TI:ALLSYM.TI};

/* ---------- appliance / station config ----------
   x,w in wall inches. wall=hung (bottom 36 AFF), floor=on slab.
   cool / hot arrays list components per that appliance's IOM,
   ordered from header toward the appliance. */
const STATIONS = [
 {id:'npe', chip:'NAVIEN NPE-180S2', x:10, w:18, h:29, mount:'wall', dark:false,
  l1:'NAVIEN', l2:'NPE-180S2', sub:'TANKLESS · 3/4"',
  conn:'3/4"', coolX:15, hotX:23,
  cool:[['ISO','ISO — branch shutoff, 1-1/4"'],['DRAIN','Drain / flush port — hose bibb on tee (descale supply)'],
        ['UNION','Union / press disconnect']],
  hot:[['ISO','ISO — branch shutoff, 1-1/4"'],['CHK','Spring check — blocks ghost flow'],
       ['UNION','Union / press disconnect'],
       ['DRAIN','Drain / flush port — hose bibb on tee (descale return)'],
       ['PRV','PRV — 150 psi water-heater relief on horizontal nipple at outlet. NO VALVE between relief and appliance']]},

 {id:'npf', chip:'NAVIEN NPF700 (no branch)', x:32, w:21, h:44, mount:'floor', dark:true,
  l1:'NAVIEN', l2:'NPF700-060u3BH', sub:'SELF-CONTAINED',
  nobranch:true,
  note:'NPF700 — self-contained ~2 gal internal loop, own pump + relief. No manifold connection. Separate scope: relief, condensate, overflow, auto-fill, ductwork.'},

 {id:'nti', chip:'NTI NC085', x:169, w:18, h:42, mount:'floor', dark:true,
  l1:'NTI', l2:'COMPASS NC085', sub:'BOILER · 1"',
  conn:'1"', coolX:55, hotX:77.5, portH:30,
  cool:[['ISO','ISO — branch shutoff, 1-1/4"'],['DRAIN','Drain / purge valve (NTI IOM)'],
        ['UNION','Union / press disconnect'],
        ['LWCO','LWCO — low water cutoff (NTI IOM)']],
  hot:[['ISO','ISO — branch shutoff, 1-1/4"'],['CHK','Spring check — blocks ghost flow'],
       ['UNION','Union / press disconnect'],['AAV','Air vent at high point (NTI IOM)'],
       ['PRV','PRV — 30 psi at factory tapping (NTI IOM)']]},

 {id:'loch', chip:'LOCHINVAR WHB055N', x:57, w:18, h:31, mount:'wall', dark:true,
  l1:'LOCHINVAR', l2:'KNIGHT WHB055N', sub:'BOILER · 1"',
  conn:'1"', coolX:85.5, hotX:94.5,
  cool:[['ISO','ISO — branch shutoff, 1-1/4"'],['DRAIN','Drain / purge valve (Lochinvar IOM)'],
        ['UNION','Union / press disconnect'],['PUMP','Boiler circulator w/ isolation flanges — CONFIRM ships-with vs field-mounted from submittal (Lochinvar)'],
        ['LWCO','LWCO — low water cutoff (Lochinvar IOM)']],
  hot:[['ISO','ISO — branch shutoff, 1-1/4"'],['CHK','Spring check — blocks ghost flow'],
       ['UNION','Union / press disconnect'],['AAV','Air vent at high point (Lochinvar IOM)'],
       ['PRV','PRV — 30 psi at factory tapping (Lochinvar IOM)']]},

 {id:'laars', chip:'LAARS LFTHF199N', x:80, w:20, h:45, mount:'floor', dark:false,
  l1:'LAARS', l2:'LFTHF-199N', sub:'BOILER · 1-1/4"',
  conn:'1-1/4"', coolX:101, hotX:127, portH:32,
  cool:[['ISO','ISO — branch shutoff, 1-1/4"'],['DRAIN','Drain / purge valve (LAARS IOM)'],
        ['UNION','Union / press disconnect'],['LWCO','LWCO — low water cutoff (LAARS IOM)']],
  hot:[['ISO','ISO — branch shutoff, 1-1/4"'],['CHK','Spring check — blocks ghost flow'],
       ['UNION','Union / press disconnect'],['AAV','Air vent at high point (LAARS IOM)'],
       ['PRV','PRV — 30 psi at factory tapping (LAARS IOM)']]},

 {id:'altac', chip:'ALTAC-136B (CH + DHW)', x:106, w:20, h:31, mount:'wall', dark:false,
  l1:'ALTA', l2:'ALTAC-136B', sub:'COMBI · 1" / 3/4"',
  altac:true,
  chCool:133, chHot:138.5, dhwCool:144, dhwHot:148.5,
  chCoolC:[['ISO','ISO — branch shutoff, 1-1/4"'],['UNION','Union / press disconnect'],
           ['DRAIN','Drain / purge valve (Alta IOM)']],
  chHotC:[['ISO','ISO — branch shutoff, 1-1/4"'],['CHK','Spring check — blocks ghost flow'],
          ['UNION','Union / press disconnect'],['PRV','PRV — 30 psi at factory tapping (Alta IOM)']],
  dhwCoolC:[['ISO','ISO — branch shutoff, 1-1/4"'],['SVC','Isolation / flush service valve — DHW plate HX (Alta IOM)']],
  dhwHotC:[['ISO','ISO — branch shutoff, 1-1/4"'],['CHK','Spring check — blocks ghost flow'],
           ['SVC','Isolation / flush service valve — DHW plate HX (Alta IOM)'],['PRV','PRV — 150 psi water-heater side relief — confirm w/ U.S. Boiler (Alta IOM)']]},

 {id:'rinnai', chip:'RINNAI CX160iN CASCADE (×2)', x:131, w:34, h:27, mount:'wall', dark:false,
  cascade:true,
  u1x:131, u2x:151, uw:14,
  l1:'RINNAI', l2:'CX160iN', sub:'TANKLESS WH · 3/4" · ×2 CASCADE'},

 {id:'spout', chip:'OPEN-LOOP SPOUT (TANKLESS)', spout:true}
];

/* Rheem tank */
const TANK = {x:197, w:32, h:67};

/* ---------- build svg ---------- */
function pipe(cls, d, name, dir){
  const pts = [...d.matchAll(/[ML]\s*([\d.\-]+)\s+([\d.\-]+)/g)].map(m=>[+m[1],+m[2]]);
  PIPES.push({pts, name, group:CUR_GROUP, dir: dir||1});
  return `<path class="pipe ${cls}" d="${d}" data-name="${esc(name)}"/>`;
}

function hotRun(cfg, comps){
  /* riser up beside the unit, lane right at cfg.h, tie vertical up into the hot manifold */
  let out = pipe('hot thin',
    `M ${fx(cfg.x)} ${fy(cfg.port)} L ${fx(cfg.x)} ${fy(cfg.h)} L ${fx(cfg.tie)} ${fy(cfg.h)} L ${fx(cfg.tie)} ${fy(HM_Y)}`, BR);
  const yT = fy(cfg.zone[1]), yB = fy(cfg.zone[0]), n = comps.length;
  comps.forEach((c,i)=>{           /* comps[0] = manifold end -> topmost in the zone */
    const t = n===1 ? .5 : i/(n-1);
    out += SYM[c[0]](fx(cfg.x), yT + t*(yB-yT), c[1]);
  });
  out += symISO(fx(cfg.tie), fy((cfg.h+HM_Y)/2), 'ISO — hot manifold tie-in shutoff, 1-1/4"');
  return out;
}
function coolRun(cfg, comps, tieX){
  /* riser down beside the unit, lane right at cfg.h into the cool manifold */
  let out = pipe('cool thin',
    `M ${fx(cfg.x)} ${fy(cfg.port)} L ${fx(cfg.x)} ${fy(cfg.h)} L ${fx(CM_X)} ${fy(cfg.h)}`, BR, -1);
  if(comps && comps.length && cfg.zone){
    const yB = fy(cfg.zone[0]), yT = fy(cfg.zone[1]), n = comps.length;
    comps.forEach((c,i)=>{         /* comps[0] = manifold end -> bottom of the zone */
      const t = n===1 ? .5 : i/(n-1);
      out += SYM[c[0]](fx(cfg.x), yB - t*(yB-yT), c[1], c[0]==='PUMP' ? -90 : 0);
    });
  }
  out += symISO(fx(tieX==null?189:tieX), fy(cfg.h), 'ISO — cool manifold tie-in shutoff, 1-1/4"');
  return out;
}

function cabinet(st){
  const yB = st.mount==='wall' ? fy(36) : fy(0);
  const yT = st.mount==='wall' ? fy(36+st.h) : fy(st.h);
  const x = fx(st.x), w = st.w*S, h = Math.abs(yB-yT);
  const name = st.note || `${st.l1} ${st.l2}`;
  return `<g data-name="${esc(name)}">
    <rect class="cab ${st.dark?'dark':''}" x="${x}" y="${yT}" width="${w}" height="${h}"/>
    <text class="cabtxt" x="${x+w/2}" y="${yT+14}" text-anchor="middle">${st.l1}</text>
    <text class="cabtxt" x="${x+w/2}" y="${yT+25}" text-anchor="middle">${st.l2}</text>
    <text class="cabsub" x="${x+w/2}" y="${yT+36}" text-anchor="middle">${st.sub}</text>
    ${st.id==='laars'||st.id==='altac'||st.id==='nti' ? symPUMP(x+w/2, yB-14,

   pumpName:'Branch circulator w/ isolation flanges — no integral pump (Navien IOM)'},
 loch:    {tiC:66,   bal:70.4, tiH:60.5},

function laneTrim(id){
  const t = LTRIM[id], L = LANES[id];
  let out = symTI(fx(t.tiC), fy(L.cool.h), 'TI — inlet thermometer')
          + symBAL(fx(t.bal), fy(L.cool.h), 'BAL — balancing valve w/ sight flow meter (set to station GPM)')
          + symTI(fx(t.tiH), fy(L.hot.h), 'TI — outlet thermometer');
  if(t.pump) out += symPUMP(fx(t.pump), fy(L.cool.h), t.pumpName, 180);
  return out;
}
function stationSVG(st){
  CUR_GROUP = st.id;
  if(st.spout) return `<g class="station" id="st-${st.id}">${spoutSVG()}</g>`;
  let s = st.cascade ? cascadeCab(st) : cabinet(st);
  if(st.nobranch) return `<g class="station" id="st-${st.id}">${s}</g>`;

  const L = LANES[st.id==='altac' ? 'altacCH' : st.id];

  if(st.altac){
    const CH = LANES.altacCH, DH = LANES.altacDHW;
    s += coolRun(CH.cool, st.chCoolC);
    s += hotRun(CH.hot, st.chHotC);
    s += coolRun(DH.cool, st.dhwCoolC);
    s += hotRun(DH.hot, st.dhwHotC);
    /* adapt stubs: cool up into cabinet bottom, hot sideways into cabinet edge */
    s += pipe('cool thin',`M ${fx(CH.cool.x)} ${fy(36)} L ${fx(CH.cool.x)} ${fy(37.5)}`, ADAPT);
    s += pipe('cool thin',`M ${fx(DH.cool.x)} ${fy(36)} L ${fx(DH.cool.x)} ${fy(37.5)}`, ADAPT);
    s += pipe('hot thin', `M ${fx(CH.hot.x)} ${fy(36)} L ${fx(CH.hot.x)} ${fy(37.5)}`, ADAPT);
    s += pipe('hot thin', `M ${fx(DH.hot.x)} ${fy(37.5)} L ${fx(st.x+st.w)-3} ${fy(37.5)}`, ADAPT);
    s += laneTrim('altacCH') + laneTrim('altacDHW');
    s += `<text class="lbl" x="${fx(110.5)}" y="${fy(38.6)}" text-anchor="middle">CH</text>
          <text class="lbl" x="${fx(124.2)}" y="${fy(38.6)}" text-anchor="middle">DHW</text>`;
  } else if(st.cascade){
    const yB = fy(36), subCool = fy(31), subHot = fy(28);
    const u1c=st.u1x+3.5, u1h=st.u1x+10.5, u2c=st.u2x+3.5, u2h=st.u2x+10.5;
    /* per-unit drops w/ service valves + PRV */
    [u1c, u2c].forEach(ux=>{
      s += pipe('cool thin', `M ${fx(ux)} ${yB} L ${fx(ux)} ${subCool}`, BR, -1);
      s += SYM.SVC(fx(ux), yB+12, 'Isolation / flush service valve (Rinnai IOM)');
    });
    [u1h, u2h].forEach(ux=>{
      s += pipe('hot thin', `M ${fx(ux)} ${yB} L ${fx(ux)} ${subHot}`, BR);
      s += SYM.PRV(fx(ux), yB+9, 'PRV — 150 psi relief on outlet nipple (Rinnai IOM)');
      s += SYM.SVC(fx(ux), yB+22, 'Isolation / flush service valve (Rinnai IOM)');
    });
    /* cascade sub-headers */
    s += pipe('cool thin', `M ${fx(u1c)} ${subCool} L ${fx(u2c)} ${subCool}`, '1-1/4" copper — cascade cold balance line (Rinnai IOM)');
    s += pipe('hot thin',  `M ${fx(u1h)} ${subHot} L ${fx(u2h)} ${subHot}`, '1-1/4" copper — cascade hot collection line (Rinnai IOM)');
    /* common home runs */
    s += hotRun(LANES.rin.hot,
      [['ISO','ISO — branch shutoff, 1-1/4"'],['CHK','Spring check — blocks ghost flow'],['UNION','Union / press disconnect']]);
    const rc = LANES.rin.cool;
    s += pipe('cool thin', `M ${fx(rc.x)} ${fy(rc.port)} L ${fx(rc.x)} ${fy(rc.h)} L ${fx(CM_X)} ${fy(rc.h)}`, BR, -1);
    s += symISO(fx(rc.x), fy(28), 'ISO — branch shutoff, 1-1/4"');
    s += symUNION(fx(141.5), fy(rc.h), 'Union / press disconnect');
    s += symISO(fx(189), fy(rc.h), 'ISO — cool manifold tie-in shutoff, 1-1/4"');
    s += laneTrim('rin');
  } else if(st.id==='nti'){
    const C = L.cool, H = L.hot;
    s += coolRun(C, []);
    s += symUNION(fx(169.4), fy(C.h), 'Union / press disconnect');
    s += symDRAIN(fx(171.8), fy(C.h), 'Drain / purge valve (NTI IOM)');
    s += symISO(fx(176), fy(C.h), 'ISO — branch shutoff, 1-1/4"');
    s += hotRun(H, st.hot.concat([['LWCO','LWCO — low water cutoff, remote-mounted at the boiler waterline (NTI IOM)']]));
    s += pipe('cool thin', `M ${fx(C.x)} ${fy(C.port)} L ${fx(st.x)+3} ${fy(C.port)}`, ADAPT);
    s += pipe('hot thin',  `M ${fx(H.x)} ${fy(H.port)} L ${fx(H.x)} ${fy(H.port+1.5)}`, ADAPT);
    s += laneTrim('nti');
  } else if(st.mount==='floor'){
    s += coolRun(L.cool, st.cool);
    s += hotRun(L.hot, st.hot);
    s += pipe('cool thin', `M ${fx(L.cool.x)} ${fy(L.cool.port)} L ${fx(st.x)+3} ${fy(L.cool.port)}`, ADAPT);
    s += pipe('hot thin',  `M ${fx(L.hot.x)} ${fy(L.hot.port)} L ${fx(st.x+st.w)-3} ${fy(L.hot.port)}`, ADAPT);
    s += laneTrim(st.id);
  } else {
    s += coolRun(L.cool, st.cool);

    s += pipe('hot thin',  `M ${fx(L.hot.x)} ${fy(37.5)} L ${st.x<L.hot.x ? fx(st.x+st.w)-3 : fx(st.x)+3} ${fy(37.5)}`, ADAPT);
    s += laneTrim(st.id);
  }
  return `<g class="station" id="st-${st.id}">${s}</g>`;

const stage = document.getElementById('stage');
const SNAP = 14;
let drag = null, ghost = null;

function svgPoint(e){
  const svgEl = stage.querySelector('svg');
  return new DOMPoint(e.clientX, e.clientY).matrixTransform(svgEl.getScreenCTM().inverse());
}
function nearestPipe(p){
  let best = null;
  PIPES.forEach(pp=>{
    const vis = pp.group==='tank' ? true : !!state[pp.group];
    if(!vis) return;
    for(let i=0;i<pp.pts.length-1;i++){
      const [x1,y1]=pp.pts[i], [x2,y2]=pp.pts[i+1];
      const dx=x2-x1, dy=y2-y1, L2=dx*dx+dy*dy;
      let t = L2 ? ((p.x-x1)*dx+(p.y-y1)*dy)/L2 : 0;
      t = Math.max(0, Math.min(1, t));
      const qx=x1+t*dx, qy=y1+t*dy;
      const d = Math.hypot(p.x-qx, p.y-qy);
      if(!best || d<best.d){
        const ang = Math.round(Math.atan2(dy*pp.dir, dx*pp.dir)*180/Math.PI);
        best = {x:qx, y:qy, d, group:pp.group, ang};
      }
    }
  });
  return best;
}

stage.addEventListener('pointerdown', e=>{
  if(mode!=='custom') return;
  const svgEl = stage.querySelector('svg');
  const g = e.target.closest ? e.target.closest('[data-cid]') : null;
  if(!g || !svgEl || !svgEl.contains(g)) return;
  e.preventDefault();
  const p = svgPoint(e);
  drag = {kind:'comp', node:g, cid:+g.getAttribute('data-cid'),
          added:g.getAttribute('data-added'), type:g.getAttribute('data-ctype'),
          name:g.getAttribute('data-name'), sx:p.x, sy:p.y, moved:false};
});
document.addEventListener('pointermove', e=>{
  if(!drag) return;
  if(drag.kind==='comp'){
    const p = svgPoint(e);
    const dx = p.x-drag.sx, dy = p.y-drag.sy;
    if(Math.hypot(dx,dy) > 3) drag.moved = true;
    drag.node.setAttribute('transform', `translate(${dx},${dy})`);
  } else if(ghost){
    ghost.style.left = (e.clientX+8)+'px'; ghost.style.top = (e.clientY+8)+'px';
  }
});
document.addEventListener('pointerup', e=>{
  if(!drag) return;
  const d = drag; drag = null;
  if(d.kind==='comp'){
    if(!d.moved){ d.node.removeAttribute('transform'); return; }
    const p = svgPoint(e), snap = nearestPipe(p);
    const isAdded = d.added!=null && d.added!=='';
    if(snap && snap.d<=SNAP && d.type && ALLSYM[d.type]){
      if(isAdded){
        const a = custom.added[+d.added];
        a.x = snap.x; a.y = snap.y; a.group = snap.group;
        if(a.type==='PUMP') a.rot = snap.ang;
      } else {
        custom.removed.add(d.cid);
        custom.added.push({type:d.type, x:snap.x, y:snap.y, name:d.name, group:snap.group,
                           rot: d.type==='PUMP' ? snap.ang : 0});
      }
    } else {
      if(isAdded) custom.added.splice(+d.added, 1);
      else custom.removed.add(d.cid);
    }
    renderScene();
  } else {
    if(ghost){ ghost.remove(); ghost = null; }
    const svgEl = stage.querySelector('svg');
    const r = svgEl.getBoundingClientRect();
    if(e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom){
      const p = svgPoint(e), snap = nearestPipe(p);
      if(snap && snap.d<=SNAP){
        custom.added.push({type:d.type, x:snap.x, y:snap.y, name:BANK_NAME[d.type], group:snap.group,
                           rot: d.type==='PUMP' ? snap.ang : 0});
        renderScene();
      }
    }
  }
});

/* ---------- tooltip ---------- */
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e=>{
  const g = e.target.closest('[data-name]');
  if(g){
    tip.textContent = g.getAttribute('data-name');
    tip.style.opacity = 1;
    tip.style.left = Math.min(e.clientX+14, innerWidth-270)+'px';
    tip.style.top  = (e.clientY+16)+'px';
  } else tip.style.opacity = 0;
});
</script>
